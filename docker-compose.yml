services:
  workoutbuddy:
    image: ghcr.io/jacolate/workoutbuddy:latest
    container_name: workoutbuddy
    restart: unless-stopped
    env_file: .env
    ports:
      # Caddy (separate host/LXC) proxies to http://<docker-host-ip>:8080
      - "${WORKOUT_PORT:-8080}:8080"
    volumes:
      - workoutbuddy-data:/data

volumes:
  workoutbuddy-data:
